name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          # Pinned: an upstream ruff release must not break main on its own.
          version: "0.17.5"
          args: "check ."

  tests:
    name: Tests (${{ matrix.requirements.label }})
    runs-on: ubuntu-latest
    strategy:
      # Both ends of the supported range are interesting: the newest stack
      # catches regressions, the minimum proves hacs.json is not lying.
      fail-fast: false
      matrix:
        requirements:
          - label: "minimum Home Assistant"
            file: requirements_test_min.txt
            python: "3.12"
          - label: "Home Assistant 2026.10"
            file: requirements_test.txt
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.requirements.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements.file }}
      - run: pip install -r ${{ matrix.requirements.file }}
      - run: pytest -q

  latest-home-assistant:
    name: Latest Home Assistant (smoke)
    runs-on: ubuntu-latest
    steps:
      # The test harness lags behind Home Assistant releases (2026.11 came out
      # before a build of it existed), so the newest version is checked by
      # booting the real thing instead. Not pinned on purpose: this job is the
      # canary for the next release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      # The `homeassistant` wheel no longer ships the frontend package. Without
      # it Home Assistant activates recovery mode, where custom integrations are
      # not loaded at all.
      - run: pip install homeassistant home-assistant-frontend
      - run: python scripts/smoke_test.py
